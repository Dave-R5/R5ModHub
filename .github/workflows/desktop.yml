name: Windows-app bouwen

# Bouwt de R5 ModHub-installer (.exe). De .exe komt alleen in een concept-release
# (draft) en als workflow-bestand: concepten zijn niet openbaar, alleen
# zichtbaar voor wie schrijfrechten op de repo heeft.
on:
  push:
    branches: [main, claude/project-thread-2m915c]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: R5-ModHub-Setup
          path: desktop/dist/*.exe
          retention-days: 30
      - name: Concept-release maken
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-v${{ steps.ver.outputs.v }}-test${{ github.run_number }}" dist/*.exe \
            --draft --target "$GITHUB_SHA" \
            --title "R5 ModHub ${{ steps.ver.outputs.v }} (Windows, test ${{ github.run_number }})" \
            --notes "Testversie. Download het .exe-bestand en voer het uit om de app te installeren."
